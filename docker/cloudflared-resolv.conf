# Bind-mounted into the cloudflared container only (see docker-compose.portal.yml) — the host's
# own /etc/resolv.conf points at Tailscale's MagicDNS resolver (100.100.100.100), which has been
# observed to SERVFAIL on external lookups after a reboot. network_mode: host means the container
# would otherwise inherit that broken resolver directly (Docker's `dns:` compose key is ignored
# under host networking — there's no separate network namespace to inject it into), so this file
# is mounted in its place instead. Public resolvers only; nothing Tailscale-internal needed here
# since cloudflared only ever resolves Cloudflare's own edge/tunnel hostnames.
nameserver 1.1.1.1
nameserver 8.8.8.8
